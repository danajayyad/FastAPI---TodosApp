{% include 'layout.html' %}
<div class="container">
    <div class="card"><div class="card-header">Make a new todo</div>
        <div class="card-body">
            <form action="" id="todoForm">
                <div class="form-group">
                    <label for="">Title</label>
                    <input type="text" name="title" class="form-control" require>
                </div>
                <div class="form-group">
                    <label for="">Description</label>
                    <textarea class="form-control" rows="3" name="description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="">Priority</label>
                    <select name="priority" class="form-control"  id="">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>

                    </select>
                </div>

                <button type="submit" class="btn btn-primary"> Add new todo</button>
                <a href="/todos/todo-page" class="btn btn-success">Back</a>
            </form>
        </div>
    </div>
</div>
